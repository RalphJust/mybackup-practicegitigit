<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Basic styling (you can move this to style.css if you want) -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      padding: 20px;
    }

    .contact-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #333333;
    }

    p.description {
      text-align: center;
      margin-bottom: 20px;
      color: #555555;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #333333;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #cccccc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button[type="submit"] {
      display: inline-block;
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    .contact-info {
      margin-top: 20px;
      font-size: 14px;
      color: #555555;
      line-height: 1.6;
    }

    .contact-info strong {
      display: inline-block;
      width: 80px;
    }

    @media (max-width: 480px) {
      .contact-container {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <h1>Contact Us</h1>
    <p class="description">
      Have questions or feedback? Fill out the form below and we will get back to you as soon as possible.
    </p>

    <!-- Replace the action with your backend URL or service (e.g., Formspree) -->
    <form action="#" method="post">
      <div class="form-group">
        <label for="name">Full Name<span aria-hidden="true" style="color:red;"> *</span></label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address<span aria-hidden="true" style="color:red;"> *</span></label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="subject">Subject<span aria-hidden="true" style="color:red;"> *</span></label>
        <input
          type="text"
          id="subject"
          name="subject"
          placeholder="What is your message about?"
          required
        />
      </div>

      <div class="form-group">
        <label for="message">Message<span aria-hidden="true" style="color:red;"> *</span></label>
        <textarea
          id="message"
          name="message"
          placeholder="Write your message here..."
          required
        ></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <p><strong>Email:</strong> youremail@example.com</p>
      <p><strong>Phone:</strong> +1 234 567 8900</p>
      <p><strong>Address:</strong> 123 Your Street, Your City, Country</p>
    </div>
  </div>
</body>
</html>
